services:
  postgres:
    image: postgres:16-alpine
    container_name: o4t-publisher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: online4tech_publisher
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d online4tech_publisher"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: o4t-publisher-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: o4t-publisher-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: o4t_local
      MINIO_ROOT_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: o4t-publisher-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      APP_URL: ${APP_URL:-http://localhost:5173}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/online4tech_publisher
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_CONFIG_ID: ${META_CONFIG_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_CONNECTION_TEST_KEY: ${META_CONNECTION_TEST_KEY:-}
      META_CONNECTION_TEST_ENABLED: ${META_CONNECTION_TEST_ENABLED:-false}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v27.0}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: o4t-publisher-worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
