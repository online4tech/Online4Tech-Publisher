name: Deploy Publisher Worker (staging)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online4tech-publisher-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate types
        run: pnpm typecheck

      - name: Run API tests
        run: pnpm --filter @o4t/api test

      - name: Run Worker tests
        run: pnpm --filter @o4t/worker test

      - name: Build frontend assets
        run: pnpm --filter @o4t/web build

      - name: Build Worker
        run: pnpm --filter @o4t/worker build

      - name: Validate deployment credentials and Hyperdrive ID
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$HYPERDRIVE_ID" || { echo "Missing GitHub repository variable HYPERDRIVE_ID"; exit 1; }
          [[ "$HYPERDRIVE_ID" =~ ^[A-Za-z0-9_-]{16,64}$ ]] || { echo "HYPERDRIVE_ID format is invalid"; exit 1; }

      - name: Add Hyperdrive binding to staging config
        shell: bash
        run: |
          cat >> apps/worker/wrangler.toml <<EOF

          [[hyperdrive]]
          binding = "HYPERDRIVE"
          id = "$HYPERDRIVE_ID"
          EOF

      - name: Deploy staging Worker
        run: pnpm --filter @o4t/worker deploy
